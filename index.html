<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Cricket Analytics Tool</title>
    <link rel="icon" type="image/png" href="./logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"><p id="boot" style="font-family:system-ui,sans-serif;padding:24px;color:#555">Loading Cricket Analytics Tool…</p></div>
    <noscript>Please enable JavaScript to use Cricket Analytics Tool.</noscript>
    <script>
      window.addEventListener("error", function (e) {
        var b = document.getElementById("boot");
        if (b) b.innerHTML = "Could not load the app: " + (e.message || (e.target && e.target.src) || "unknown error") + ". Check that the Pages source is set to GitHub Actions.";
      }, true);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
